[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

[licenses]
# Add an SPDX identifier here when a dependency first needs it, and only if
# its terms allow distribution as part of a GPL-3.0-or-later work.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# A path dependency on another workspace crate has no version, which counts as
# a wildcard. That is safe here because no crate is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
